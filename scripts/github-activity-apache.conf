# Enabled by deploy.sh. Keep the JSON outside the site's rsync --delete destination.
Alias "/github-activity/activity.json" "/srv/blog-activity/activity.json"
<Directory "/srv/blog-activity">
    Options -Indexes
    AllowOverride None
    Require all granted
    <Files "activity.json">
        Header set Cache-Control "public, max-age=300"
        Header set X-Content-Type-Options "nosniff"
    </Files>
</Directory>
